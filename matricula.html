<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matricula da academia</title>
</head>
<body>
    <h1>Matrícula</h1>
    <p>Preencha o formulário abaixo para realizar sua matrícula:</p>
    <fieldset>
        <form onsubmit="alert('Formulário enviado com sucesso!'); return false;">
        <legend>Infrmações Pessoais</legend>   
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required type="text" onblur="if(this.value===''){alert('Campo nome obrigatório!')}"><br><br>
        <br><br>
        <label for="CPF">CPF:</label>
        <input type="number" id="CPF" name="CPF" required type="number" onblur="if(this.value===''){alert('Campoo CPF obrigatorio!')}"><br><br>
        <br><br>
        <label for="data_nascimento">Data de Nascimento:</label>
        <input type="date" id="data_nascimento" name="data_nascimento" required type="date" onblur="if(this.value===''){alert('data de nascimento obrigatória')}"><br><br>
        <br><br>
        <input type="radio" id="masculino" name="sex" value="masculino" required>
        <label for="masculino">Masculino</label>
        <input type="radio" id="feminino" name="sex" value="feminino">
        <label for="feminino">Feminino</label> 
    </fieldset>
        <br><br>
        
        <legend>Informações de Contato</legend>
        <label for="objetivos">Objetivos:</label>
        <select id="objetivos" name="objetivos" required>
            <option value="">Selecione um objetivo</option>
            <option value="perda_peso">Perda de Peso</option>
            <option value="ganho_muscular">Ganho Muscular</option>
            <option value="melhora_condicao_fisica">Melhora da Condição Física</option>
        </select>
        <br><br>
        
        <br><br>
        <label for="plano">Plano:</label>
        <select id="plano" name="plano" required>
            <option value="">Selecione um plano</option>
            <option value="basico">Plano Básico</option>
            <option value="intermediario">Plano Intermediário</option>
            <option value="avancado">Plano Avançado</option>
        </select>
        <br><br>
        <label for="Possui restrição médica">Possui Restrição Médica:</label>
        <select id="Possui restrição médica" name="Possui restrição médica" required>
            <option value="">Selecione uma opção</option>
            <option value="sim">Sim</option>
            <option value="nao">Não</option>
        
        </select>
        <br><br>
        <label for="Observações">Observações:</label>
            <input type="text" id="Observações" name="Observações" placeholder="Alguma observação adicional?">
        </label>
        
        <br><br>
        <input type="submit" value="Realizar Matrícula">
    </form>

    </body>
</html>
